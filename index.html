<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Obituario Familiar — En Memoria</title>
    <meta name="description" content="Un santuario sereno para recordar y honrar la memoria de quienes nos precedieron." />
    <meta name="theme-color" content="#050709" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Obituario" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Precarga del primer fotograma de la puerta en teléfonos -->
    <link rel="preload" as="image" href="/gif/opendoor/frame_001.webp" media="(max-width: 768px)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #050709; color: #f2efe9; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: #050709;
        color: #c9a86a;
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.5rem; letter-spacing: 0.1em;
        overscroll-behavior: none;
        touch-action: none;
      }
      #boot .boot-frame {
        display: none;
        width: 100%; height: 100%;
        object-fit: cover;
        user-select: none;
        pointer-events: none;
      }
      @media (max-width: 768px) {
        /* En teléfonos la entrada la protagonizan los fotogramas de la puerta. */
        #boot { background: #010308; font-size: 0; }
        #boot > span { display: none; }
        #boot .boot-frame { display: block; }
      }
      .arch-card {
        border-radius: 9999px 9999px 18px 18px !important;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(201, 168, 106, 0.28);
        background: radial-gradient(circle at 50% 0%, rgba(201, 168, 106, 0.12) 0%, transparent 45%), linear-gradient(172deg, rgba(32, 38, 48, 0.72) 0%, rgba(17, 21, 28, 0.95) 55%, rgba(9, 12, 16, 0.99) 100%);
      }
    </style>
    <script>
      if (typeof window !== "undefined") {
        window.$RefreshReg$ = window.$RefreshReg$ || function () {};
        window.$RefreshSig$ = window.$RefreshSig$ || function () { return function (type) { return type; }; };
        window.__vite_plugin_react_preamble_installed__ = true;
      }
    </script>
  </head>
  <body class="selection:bg-gold/30 selection:text-gold-soft font-sans antialiased min-h-[100dvh]">
    <div id="root"></div>
    <div id="boot">
      <img class="boot-frame" src="/gif/opendoor/frame_001.webp" alt="" draggable="false" fetchpriority="high" />
      <span>✦ Entrando al Santuario Familiar…</span>
    </div>
    <script>
      // Splash de entrada de la puerta con fotogramas: sólo en teléfonos.
      // Se muestra la puerta cerrada, se precargan los 10 fotogramas y se
      // reproducen al estar listos; luego se desvanece y deja ver la app.
      (function () {
        var boot = document.getElementById("boot");
        if (!boot) return;
        var esMovil = window.matchMedia("(max-width: 768px)").matches;
        if (!esMovil) {
          boot.parentNode.removeChild(boot);
          return;
        }

        var FRAMES = [
          "/gif/opendoor/frame_001.webp",
          "/gif/opendoor/frame_002.webp",
          "/gif/opendoor/frame_003.webp",
          "/gif/opendoor/frame_004.webp",
          "/gif/opendoor/frame_005.webp",
          "/gif/opendoor/frame_006.webp",
          "/gif/opendoor/frame_007.webp",
          "/gif/opendoor/frame_008.webp",
          "/gif/opendoor/frame_009.webp",
          "/gif/opendoor/frame_010.webp"
        ];
        var FRAME_MS = 120;
        var MAX = 6000;
        var img = boot.querySelector(".boot-frame");
        var overflowAnterior = document.body.style.overflow;
        document.body.style.overflow = "hidden";

        var cerrado = false;
        var paginaLista = document.readyState === "complete";
        var animacionTerminada = false;
        var arrancada = false;

        function cerrar() {
          if (cerrado) return;
          cerrado = true;
          boot.style.transition = "opacity 450ms ease-out";
          boot.style.opacity = "0";
          document.body.style.overflow = overflowAnterior;
          window.setTimeout(function () {
            if (boot.parentNode) boot.parentNode.removeChild(boot);
          }, 450);
        }

        function intentarCerrar() {
          if (paginaLista && animacionTerminada) cerrar();
        }

        function iniciarAnimacion() {
          if (arrancada) return;
          arrancada = true;
          if (!img) {
            animacionTerminada = true;
            intentarCerrar();
            return;
          }
          var i = 0;
          var timer = window.setInterval(function () {
            i += 1;
            if (i >= FRAMES.length) {
              window.clearInterval(timer);
              animacionTerminada = true;
              intentarCerrar();
              return;
            }
            img.src = FRAMES[i];
          }, FRAME_MS);
        }

        // Precargar todos los fotogramas; al estar listos, abrir la puerta.
        var listas = 0;
        for (var i = 0; i < FRAMES.length; i++) {
          var pre = new Image();
          pre.onload = function () {
            listas += 1;
            if (listas >= FRAMES.length) iniciarAnimacion();
          };
          pre.onerror = function () {
            listas += 1;
            if (listas >= FRAMES.length) iniciarAnimacion();
          };
          pre.src = FRAMES[i];
        }

        // Red muy lenta: no bloquear la entrada esperando fotogramas eternamente.
        window.setTimeout(iniciarAnimacion, 2500);

        if (!paginaLista) {
          window.addEventListener("load", function () {
            paginaLista = true;
            intentarCerrar();
          });
        }

        window.setTimeout(cerrar, MAX);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
